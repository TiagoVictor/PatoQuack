<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PatoQuack · Voz</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="app">
    <header class="brand">
      <h1>PatoQuack</h1>
      <span class="tag">voz</span>
    </header>

    <section id="join-view" class="card">
      <form id="join-form" autocomplete="on">
        <label>
          Seu nome
          <input id="name" name="name" maxlength="32" required autocomplete="nickname" placeholder="Ex.: Tiago">
        </label>
        <label>
          Sala
          <input id="room" name="room" maxlength="32" required pattern="[A-Za-z0-9_\-]+"
                 title="Letras, números, - ou _" placeholder="geral">
        </label>
        <button type="submit" id="join-btn" class="primary">Entrar na voz</button>
      </form>
    </section>

    <section id="room-view" class="card" hidden>
      <div class="room-header">
        <h2><span class="hash">#</span><span id="room-name"></span></h2>
        <span id="count" class="muted-text"></span>
      </div>
      <figure id="stream-view" class="stream" hidden>
        <video id="stream-video" autoplay playsinline muted></video>
        <figcaption><span class="live-dot" aria-hidden="true"></span><span id="stream-label"></span></figcaption>
      </figure>
      <ul id="participants" class="participants" aria-live="polite"></ul>
      <div class="controls stream-controls">
        <button type="button" id="screen-btn">Transmitir tela</button>
        <button type="button" id="camera-btn">Transmitir câmera</button>
        <button type="button" id="stop-stream-btn" class="active" hidden>Parar transmissão</button>
      </div>
      <div class="controls">
        <button type="button" id="mute-btn" aria-pressed="false">Mutar</button>
        <button type="button" id="leave-btn" class="danger">Sair</button>
      </div>
    </section>

    <p id="status" class="status" role="status" data-level="info"></p>

    <details class="log">
      <summary>Log</summary>
      <ol id="log"></ol>
    </details>

    <!-- Elementos <audio> dos participantes remotos -->
    <div id="remote-audio" hidden></div>
  </main>

  <script>
    // Rede de segurança: se o app falhar ao carregar, mostra o erro em vez de "não acontecer nada".
    function showFatal(message) {
      var s = document.getElementById('status');
      s.dataset.level = 'error';
      s.textContent = message;
    }
    if (location.protocol === 'file:') {
      showFatal('Esta página foi aberta direto do disco (file://), e assim o navegador bloqueia o app. ' +
        'Rode "dotnet run --project src/PatoQuack.Server" e acesse http://localhost:5003.');
    }
    window.addEventListener('error', function (e) { showFatal('Erro no app: ' + e.message); });
    window.addEventListener('unhandledrejection', function (e) {
      showFatal('Erro no app: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    // Sem o JS, o formulário recarregaria a página. O app.js substitui este handler.
    document.getElementById('join-form').onsubmit = function (e) {
      e.preventDefault();
      showFatal(location.protocol === 'file:'
        ? 'Abra pelo servidor: http://localhost:5003 (não pelo arquivo index.html).'
        : typeof signalR === 'undefined'
        ? 'Não foi possível carregar o SignalR do CDN (cdn.jsdelivr.net). Verifique a internet ou bloqueadores.'
        : 'O app ainda não carregou. Recarregue a página (Cmd+Shift+R).');
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@10.0.0/dist/browser/signalr.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
